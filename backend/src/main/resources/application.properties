# =====================================================================
#  Aplicación
# =====================================================================
quarkus.http.root-path=/api
quarkus.http.port=8080
quarkus.http.limits.max-body-size=10M
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true

# =====================================================================
#  Base de datos
#  En contenedores se sobreescribe con QUARKUS_DATASOURCE_JDBC_URL,
#  QUARKUS_DATASOURCE_USERNAME y QUARKUS_DATASOURCE_PASSWORD.
# =====================================================================
quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:sistema}
%dev.quarkus.datasource.username=${POSTGRES_USER:sistema}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:cambia_esto}

# =====================================================================
#  ORM + Flyway
# =====================================================================
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true

# =====================================================================
#  Archivos subidos (imágenes de productos)
# =====================================================================
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}

# =====================================================================
#  JWT en cookie HttpOnly (las llaves se montan fuera del repositorio)
# =====================================================================
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
mp.jwt.verify.issuer=sistema
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:keys/privateKey.pem}

# =====================================================================
#  OpenAPI / Swagger
#  En producción Swagger UI queda deshabilitado por defecto.
# =====================================================================
quarkus.smallrye-openapi.info-title=Sistema Tienda Condominio
quarkus.smallrye-openapi.info-version=0.1.0
